spring.application.name=evelyn

# Permite executar localmente lendo o .env desta pasta (variáveis de ambiente têm prioridade).
spring.config.import=optional:file:.env[.properties]

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:convite}}
spring.datasource.username=${POSTGRES_USER:convite}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# JSON: rejeita números decimais em campos inteiros (ex.: quantidade 2.5)
spring.jackson.deserialization.accept-float-as-int=false

# Servidor
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator: somente o health, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Regras da aplicação
app.convite.max-participantes=${MAX_PARTICIPANTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao=${JWT_EXPIRACAO:8h}
app.admin.usuario=${ADMIN_USERNAME:}
app.admin.senha=${ADMIN_PASSWORD:}
app.admin.redefinir-senha=${ADMIN_RESET_PASSWORD:false}
app.rate-limit.cadastros-por-minuto=${RATE_LIMIT_CADASTROS:10}
app.rate-limit.logins-por-minuto=${RATE_LIMIT_LOGINS:5}
app.relatorio.fuso-horario=${RELATORIO_FUSO_HORARIO:America/Sao_Paulo}
