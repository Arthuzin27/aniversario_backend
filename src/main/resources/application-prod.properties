# Perfil de PRODUÇÃO (SPRING_PROFILES_ACTIVE=prod), usado pelo docker-compose.prod.yml.
# Tudo o que é sensível vem de variáveis de ambiente (arquivo .env da VPS); nada de segredo aqui.
# Sem valor padrão de propósito: se a variável faltar, a aplicação não sobe.

# Banco de dados (a URL vem de SPRING_DATASOURCE_URL, definida no compose)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Atrás do Nginx: o ForwardedHeaderFilter usa X-Forwarded-For/Proto/Port, então o Spring enxerga o IP real
# do cliente (usado pelo rate limit) e o esquema https. O Nginx sobrescreve esses cabeçalhos, e a porta do
# backend só é publicada em 127.0.0.1, então o cliente não consegue forjá-los.
server.forward-headers-strategy=framework

# Actuator: somente o health, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger desligado, a menos que SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Endereço(s) do site na Vercel
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
