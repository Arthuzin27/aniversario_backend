# Incluído no server e em toda location que define add_header própria
# (no Nginx, um add_header dentro da location descarta os herdados do server).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS curto de propósito no início. Depois que tudo estiver estável, pode subir (ex.: 31536000).
# Atenção: HSTS vale para o host inteiro (todas as portas), não só para a 3041.
add_header Strict-Transport-Security "max-age=300" always;
