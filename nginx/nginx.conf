# API do convite atrás de HTTPS. Publicado na VPS como 3041 -> 443.
# O frontend fica na Vercel e chama https://brenonun3s.vps-kinghost.net:3041/api/...

# DNS interno do Docker: resolve "backend" a cada requisição, então o Nginx sobe mesmo se o
# backend estiver reiniciando (sem "host not found in upstream").
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name brenonun3s.vps-kinghost.net;

    ssl_certificate     /etc/letsencrypt/live/brenonun3s.vps-kinghost.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brenonun3s.vps-kinghost.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:convite_ssl:5m;
    ssl_session_timeout 1h;

    # Quem acessar http:// na porta 3041 é redirecionado para https://
    error_page 497 =301 https://$host:3041$request_uri;

    server_tokens off;
    # A API só recebe JSON pequeno (não há upload de arquivos)
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    set $convite_backend http://backend:8080;

    # O Spring Security também envia estes headers (HSTS de 1 ano com includeSubDomains!).
    # Descarta os do backend para valerem só os do security-headers.conf, sem duplicar.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    # --- API: todos os controllers estão sob /api (public, auth, admin) -------------
    # O CORS (pré-voo OPTIONS incluso) é respondido pelo Spring, conforme CORS_ALLOWED_ORIGINS.
    location /api/ {
        proxy_pass $convite_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sobrescreve (não acrescenta): o Nginx é a borda, então o valor enviado pelo cliente é descartado
        # e o backend/rate limit sempre recebe o IP real, sem possibilidade de falsificação.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  3041;
        proxy_read_timeout 60s;
    }

    # --- Actuator: só o health é acessível de fora ---------------------------------
    location = /actuator/health {
        proxy_pass $convite_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /actuator {
        return 404;
    }

    # Qualquer outra coisa (o site está na Vercel)
    location / {
        return 404;
    }
}
